<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f9fb">
  <title>日历 · Dayline</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="/" aria-label="Dayline 日历首页"><span class="brand-mark"><span></span><span></span><span></span><span></span></span><span>dayline</span></a>
      <button class="create-button" id="create-event"><span class="plus">＋</span> 创建日程</button>
      <section class="mini-section" aria-label="迷你日历">
        <div class="mini-heading"><button class="icon-button" id="mini-prev" aria-label="上个月">‹</button><strong id="mini-title"></strong><button class="icon-button" id="mini-next" aria-label="下个月">›</button></div>
        <div class="mini-grid mini-weekdays"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
        <div class="mini-grid" id="mini-days"></div>
      </section>
      <div class="sidebar-rule"></div>
      <section class="calendars">
        <h2>我的日历</h2>
        <label><input type="checkbox" checked data-filter="blue"><i class="dot blue"></i>个人</label>
        <label><input type="checkbox" checked data-filter="green"><i class="dot green"></i>工作</label>
        <label><input type="checkbox" checked data-filter="orange"><i class="dot orange"></i>重要日期</label>
        <label><input type="checkbox" checked data-filter="pink"><i class="dot pink"></i>生活</label>
      </section>
      <div class="sidebar-bottom"><span class="avatar">林</span><span class="profile"><b>林知夏</b><small>个人空间</small></span><button class="icon-button more" aria-label="更多选项">···</button></div>
    </aside>
    <main class="main-content">
      <header class="topbar">
        <div class="heading-group"><span class="eyebrow" id="today-label"></span><h1 id="month-heading"></h1></div>
        <div class="toolbar"><button class="today-button" id="go-today">今天</button><div class="month-nav"><button class="icon-button" id="prev-month" aria-label="上个月">‹</button><button class="icon-button" id="next-month" aria-label="下个月">›</button></div><span class="toolbar-divider"></span><select class="view-select" id="view-select" aria-label="日历视图"><option value="month">月视图</option><option value="day">日视图</option><option value="month-day">月-日视图</option></select></div>
      </header>
      <section class="calendar" id="month-view" aria-label="月历"><div class="weekday-row"><span>周一</span><span>周二</span><span>周三</span><span>周四</span><span>周五</span><span>周六</span><span>周日</span></div><div class="month-grid" id="month-grid"></div></section>
      <section class="month-day-view hidden" id="month-day-view" aria-label="月历和当日日程"><div class="month-day-calendar"><div class="weekday-row"><span>周一</span><span>周二</span><span>周三</span><span>周四</span><span>周五</span><span>周六</span><span>周日</span></div><div class="month-grid" id="month-day-grid"></div></div><aside class="agenda-panel"><header class="agenda-heading"><div><p class="eyebrow">当日日程</p><h2 id="agenda-date"></h2></div><button class="icon-button" id="agenda-add" aria-label="为所选日期添加日程">＋</button></header><div class="agenda-list" id="agenda-list"></div></aside></section>
      <section class="day-view hidden" id="day-view" aria-label="日视图"><div class="all-day-row"><div class="all-day-label">全天</div><div class="all-day-events" id="all-day-events"></div></div><div class="day-scroll" id="day-scroll"><div class="time-grid" id="time-grid"></div><div class="timed-event-layer" id="timed-event-layer"></div></div></section>
    </main>
  </div>
  <dialog id="event-dialog">
    <form id="event-form">
      <div class="dialog-header"><div><p class="eyebrow" id="dialog-eyebrow">新日程</p><h2 id="dialog-title">安排一件事</h2></div><button type="button" class="icon-button close-button" id="close-dialog" aria-label="关闭">×</button></div>
      <label class="field-label" for="event-title">标题</label><input class="text-input title-input" id="event-title" name="title" maxlength="120" placeholder="给这件事起个名字" required>
      <div class="field-row"><div class="field"><label class="field-label" for="event-date">日期</label><input class="text-input" id="event-date" name="date" type="date" required></div><div class="field"><label class="field-label" for="event-color">日历</label><select class="text-input" id="event-color" name="color"><option value="blue">个人</option><option value="green">工作</option><option value="orange">重要日期</option><option value="pink">生活</option><option value="purple">其他</option></select></div></div>
      <div class="field-row"><div class="field"><label class="field-label" for="event-start">开始时间</label><input class="text-input" id="event-start" name="start_time" type="time"></div><div class="field"><label class="field-label" for="event-end">结束时间</label><input class="text-input" id="event-end" name="end_time" type="time"></div></div>
      <label class="field-label" for="event-notes">备注</label><textarea class="text-input notes-input" id="event-notes" name="notes" maxlength="1000" rows="3" placeholder="添加一些细节"></textarea>
      <div class="dialog-footer"><button type="button" class="delete-button hidden" id="delete-event">删除日程</button><span class="form-error" id="form-error" role="alert"></span><button class="save-button" type="submit" id="save-event">保存日程</button></div>
    </form>
  </dialog>
  <div class="toast" id="toast" role="status"></div>
  <script src="/static/app.js" defer></script>
</body>
</html>
