<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f9fb">
  <title>日历 · Dayline</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="/" aria-label="Dayline 日历首页"><span class="brand-mark"><span></span><span></span><span></span><span></span></span><span>dayline</span></a>
      <button class="create-button" id="create-event"><span class="plus">＋</span> 创建日程</button>
      <section class="calendars">
        <h2>我的日历</h2>
        <div class="category-list" id="category-list"></div>
        <button type="button" class="add-category-button" id="add-category"><span aria-hidden="true">＋</span>新增类型</button>
      </section>
      <div class="sidebar-bottom"><span class="avatar">林</span><span class="profile"><b>林知夏</b><small>个人空间</small></span><button class="icon-button more" aria-label="更多选项">···</button></div>
    </aside>
    <main class="main-content">
      <header class="topbar">
        <div class="heading-group"><span class="eyebrow" id="today-label"></span><h1 id="month-heading"></h1></div>
        <div class="toolbar"><button class="today-button" id="go-today">今天</button><div class="month-nav"><button class="icon-button" id="prev-month" aria-label="上个月">‹</button><button class="icon-button" id="next-month" aria-label="下个月">›</button></div></div>
      </header>
      <section class="month-day-view" id="month-day-view" aria-label="月历和当日日程"><div class="month-day-calendar"><div class="weekday-row"><span>周一</span><span>周二</span><span>周三</span><span>周四</span><span>周五</span><span>周六</span><span>周日</span></div><div class="month-grid" id="month-day-grid"></div></div><aside class="agenda-panel"><header class="agenda-heading"><div><p class="eyebrow">当日日程</p><h2 id="agenda-date"></h2></div><button class="icon-button" id="agenda-add" aria-label="为所选日期添加日程">＋</button></header><div class="agenda-scroll" id="agenda-scroll"><section class="agenda-all-day"><h3>全天</h3><div id="agenda-all-day-events"></div></section><div class="agenda-hours" id="agenda-hours"></div></div></aside></section>
    </main>
  </div>
  <dialog id="category-dialog">
    <form id="category-form">
      <div class="dialog-header"><div><p class="eyebrow">我的日历</p><h2 id="category-dialog-title">新增类型</h2></div><button type="button" class="icon-button close-button" id="close-category-dialog" aria-label="关闭">×</button></div>
      <label class="field-label" for="category-name">类型名称</label><input class="text-input title-input" id="category-name" name="name" maxlength="24" placeholder="例如：学习、运动" required>
      <label class="field-label" for="category-color">标记颜色</label><input class="category-color-input" id="category-color" name="color" type="color" value="#5684E8">
      <div class="dialog-footer"><span class="form-error" id="category-error" role="alert"></span><button class="save-button" type="submit">创建类型</button></div>
    </form>
  </dialog>
  <dialog id="category-delete-dialog">
    <form id="category-delete-form">
      <div class="dialog-header"><div><p class="eyebrow">删除类型</p><h2 id="category-delete-title"></h2></div><button type="button" class="icon-button close-button" id="close-category-delete" aria-label="关闭">×</button></div>
      <p class="delete-category-summary" id="category-delete-summary"></p>
      <div id="category-migration-field"><label class="field-label" for="category-replacement">将关联日程迁移到</label><select class="text-input" id="category-replacement"></select></div>
      <div class="dialog-footer"><span class="form-error" id="category-delete-error" role="alert"></span><button class="delete-button" type="submit">删除类型并迁移</button></div>
    </form>
  </dialog>
  <dialog id="event-dialog">
    <form id="event-form">
      <div class="dialog-header"><div><p class="eyebrow" id="dialog-eyebrow">新日程</p><h2 id="dialog-title">安排一件事</h2></div><div class="dialog-actions"><button type="button" class="delete-button hidden" id="delete-event">删除日程</button><button type="button" class="icon-button close-button" id="close-dialog" aria-label="关闭">×</button></div></div>
      <label class="field-label" for="event-title">标题</label><input class="text-input title-input" id="event-title" name="title" maxlength="120" placeholder="给这件事起个名字" required>
      <div class="field-row"><div class="field"><label class="field-label" for="event-date">日期</label><input class="text-input" id="event-date" name="date" type="date" required></div><div class="field"><label class="field-label" for="event-color">日历</label><select class="text-input" id="event-color" name="color"><option value="blue">个人</option><option value="green">工作</option><option value="orange">重要日期</option><option value="pink">生活</option><option value="purple">其他</option></select></div></div>
      <div class="field-row"><div class="field"><label class="field-label" for="event-start">开始时间</label><input class="text-input" id="event-start" name="start_time" type="time"></div><div class="field"><label class="field-label" for="event-end">结束时间</label><input class="text-input" id="event-end" name="end_time" type="time"></div></div>
      <label class="field-label" for="event-notes">备注</label><textarea class="text-input notes-input" id="event-notes" name="notes" maxlength="1000" rows="3" placeholder="添加一些细节"></textarea>
      <div class="dialog-footer"><span class="form-error" id="form-error" role="alert"></span><button class="save-button" type="submit" id="save-event">保存日程</button></div>
    </form>
  </dialog>
  <dialog id="event-delete-dialog">
    <form id="event-delete-form">
      <div class="dialog-header"><div><p class="eyebrow">删除日程</p><h2 id="event-delete-title">确认删除？</h2></div><button type="button" class="icon-button close-button" id="close-event-delete" aria-label="关闭">×</button></div>
      <p class="delete-category-summary">删除后无法恢复。</p>
      <div class="dialog-footer"><button type="button" class="today-button" id="cancel-event-delete">取消</button><button class="delete-button confirm-delete-button" type="submit">删除日程</button></div>
    </form>
  </dialog>
  <div class="toast" id="toast" role="status"></div>
  <script src="/static/app.js" defer></script>
</body>
</html>
